<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1736">
<title>Daily Tracker</title>
<style>
  /* ================= THEME ================= */
  :root{
    color-scheme:light;
    --bg:#eef2f7;--bg2:#f6f8fb;--card:#ffffff;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--line:#e2e8f0;--box:#cbd5e1;
    --pri:#1d4ed8;--pri2:#2563eb;--pri-soft:#e8efff;
    --acc:#059669;--acc-soft:#dcfce7;
    --mid:#b45309;--mid-soft:#fef3c7;
    --warn:#c2410c;--warn-soft:#ffedd5;
    --bad:#dc2626;--bad-soft:#fee2e2;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px -14px rgba(15,23,42,.22);
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --hdr:linear-gradient(115deg,#0a1530 0%,#132e66 55%,#0e4f78 100%);
    --hero:linear-gradient(135deg,#0a1530 0%,#1d3f8f 52%,#0b7c86 100%);
    --radius:16px;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#070d1a;--bg2:#0c1528;--card:#101a2f;--ink:#eaf0fc;--ink2:#c3cee6;--mute:#8d9bba;--line:#1f2b46;--box:#3a4a6b;
    --pri:#8fb0ff;--pri2:#3b6cf6;--pri-soft:#182850;
    --acc:#34d399;--acc-soft:#0e3127;
    --mid:#fbbf24;--mid-soft:#3a2c0a;
    --warn:#fb923c;--warn-soft:#3b200e;
    --bad:#f87171;--bad-soft:#3d1717;
    --shadow:0 12px 30px -16px rgba(0,0,0,.8);
    --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#070d1a;--bg2:#0c1528;--card:#101a2f;--ink:#eaf0fc;--ink2:#c3cee6;--mute:#8d9bba;--line:#1f2b46;--box:#3a4a6b;
      --pri:#8fb0ff;--pri2:#3b6cf6;--pri-soft:#182850;
      --acc:#34d399;--acc-soft:#0e3127;
      --mid:#fbbf24;--mid-soft:#3a2c0a;
      --warn:#fb923c;--warn-soft:#3b200e;
      --bad:#f87171;--bad-soft:#3d1717;
      --shadow:0 12px 30px -16px rgba(0,0,0,.8);
      --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset;
    }
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    background:
      radial-gradient(900px 380px at 110% -5%, rgba(37,99,235,.12), transparent 60%),
      radial-gradient(700px 360px at -15% 105%, rgba(5,150,105,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);min-height:100vh;
    padding-bottom:calc(92px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    font-variant-numeric:tabular-nums;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  svg{display:block}

  /* ================= HEADER ================= */
  header{position:sticky;top:0;z-index:10;background:var(--hdr);color:#fff;overflow:hidden;box-shadow:0 6px 20px -10px rgba(10,21,48,.6)}
  header::before,header::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
  header::before{width:220px;height:220px;right:-60px;top:-120px;background:radial-gradient(circle,rgba(56,189,248,.35),transparent 70%)}
  header::after{width:160px;height:160px;left:30%;top:-110px;border:1px solid rgba(255,255,255,.08)}
  .hdr-in{position:relative;max-width:720px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#0a1530;
        background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:0 4px 12px -4px rgba(245,158,11,.7)}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.15}
  .brand small{display:block;font-size:12px;color:rgba(255,255,255,.72);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-r{display:flex;align-items:center;gap:8px}
  .sync{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 10px;border-radius:99px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .dot.ok{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
  .dot.err{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.25)}
  .dot.loading{background:#fbbf24;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .hbtn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
  .hbtn:hover{background:rgba(255,255,255,.2)}
  @media (max-width:420px){ #syncText{display:none} .sync{padding:8px} }

  main{max-width:720px;margin:0 auto;padding:16px}
  .page{display:none;animation:fade .25s ease}.page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h3{font-size:12px;color:var(--mute);font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
  h3::before{content:"";width:4px;height:14px;border-radius:4px;background:linear-gradient(var(--pri2),var(--acc))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}

  /* ================= SEGMENT ================= */
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-size:14px;color:var(--mute);font-weight:600;transition:all .2s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;box-shadow:0 6px 14px -8px rgba(37,99,235,.9)}

  /* ================= DATE BAR ================= */
  .datebar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
  .datebar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:10px;font-weight:700;text-align:center;color:var(--ink);font-size:15px}
  .datebar input:focus{outline:2px solid var(--pri2);outline-offset:1px}
  .nav-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;color:var(--ink2);font-weight:600}
  .nav-btn:hover{border-color:var(--pri2);color:var(--pri2)}
  .today-btn{border:1px solid transparent;background:var(--pri-soft);color:var(--pri);border-radius:11px;padding:0 13px;height:40px;font-size:13px;font-weight:700;white-space:nowrap}
  .today-btn:hover{border-color:var(--pri2)}
  .date-label{font-size:13px;color:var(--mute);margin:2px 4px 14px;font-weight:500}
  .date-label b{color:var(--pri);font-weight:700}
  .range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .range label{font-size:12px;color:var(--mute);font-weight:600;display:flex;flex-direction:column;gap:6px}
  .range input{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px;color:var(--ink);font-weight:600}

  /* ================= STAT CARDS ================= */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;box-shadow:var(--shadow);overflow:hidden}
  .stat::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--pri2))}
  .stat .s-top{display:flex;align-items:center;gap:7px}
  .s-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--cs,var(--pri-soft));color:var(--c,var(--pri2));flex-shrink:0}
  .stat small{color:var(--mute);font-size:12px;font-weight:600}
  .stat b{font-size:26px;font-weight:800;display:block;margin-top:8px;color:var(--ink);letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.ok{--c:var(--acc);--cs:var(--acc-soft)} .stat.ok b{color:var(--acc)}
  .stat.warn{--c:var(--warn);--cs:var(--warn-soft)} .stat.warn b{color:var(--warn)}
  .stat.pri{--c:var(--pri2);--cs:var(--pri-soft)} .stat.pri b{color:var(--pri)}
  .stat.gold{--c:#d97706;--cs:var(--mid-soft)}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar > div{height:100%;background:linear-gradient(90deg,#2563eb,#10b981);border-radius:99px;transition:width .4s}

  /* ================= HERO ================= */
  .hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 18px 36px -18px rgba(13,40,110,.75)}
  .hero::before{content:"";position:absolute;width:240px;height:240px;right:-70px;top:-90px;border-radius:50%;border:30px solid rgba(255,255,255,.06)}
  .hero::after{content:"";position:absolute;width:140px;height:140px;right:40px;bottom:-80px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.35),transparent 70%)}
  .hero > *{position:relative;z-index:1}
  .hero .chip-lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:99px}
  .hero .big{font-size:40px;font-weight:800;margin:12px 0 2px;letter-spacing:-1px;line-height:1.1}
  .hero .sub{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}

  /* ================= CHECKLIST ================= */
  .ck-row{display:flex;align-items:center;gap:12px;padding:13px 12px 13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:9px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
  .ck-row:hover{border-color:var(--pri2)}
  .ck-row input{display:none}
  .ck-box{width:24px;height:24px;border-radius:8px;border:2px solid var(--box);flex-shrink:0;display:grid;place-items:center;transition:all .2s;background:var(--card)}
  .ck-row.done{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 35%,transparent)}
  .ck-row.done .ck-box{background:var(--acc);border-color:var(--acc)}
  .ck-row.done .ck-box::after{content:"✓";color:#fff;font-size:15px;font-weight:800}
  .ck-row.done .ck-text{text-decoration:line-through;color:var(--mute)}
  .ck-text{flex:1;font-size:15px;font-weight:500;color:var(--ink)}
  .icon-btn{border:0;background:none;color:var(--mute);width:32px;height:32px;border-radius:9px;font-size:13px;flex-shrink:0}
  .icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
  .add-form{display:flex;gap:8px;margin-top:14px}
  .add-form input{flex:1;min-width:0;border:1px dashed var(--box);background:var(--card);border-radius:13px;padding:13px;color:var(--ink)}
  .add-form input:focus{outline:2px solid var(--pri2);border-style:solid}
  .btn{border:0;background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:13px;padding:12px 20px;font-weight:700;box-shadow:0 8px 18px -10px rgba(37,99,235,.9)}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6}
  .btn.block{width:100%;padding:15px;font-size:16px}

  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wd{font-size:11px;color:var(--mute);text-align:center;font-weight:700;padding-bottom:2px}
  .day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg2);color:var(--mute);border:1px solid var(--line);padding:0}
  button.day:hover{transform:scale(1.06)}
  .day.full{background:var(--acc);border-color:var(--acc);color:#fff}
  .day.half{background:var(--mid-soft);border-color:transparent;color:var(--mid)}
  .day.low{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .day.zero{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .day.future{background:none;border:1px dashed var(--line);opacity:.7}
  .day.blank{visibility:hidden}
  .day.is-today{outline:2px solid var(--pri2);outline-offset:2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--mute);font-weight:500}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

  .prow{margin-bottom:14px}
  .prow .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px;font-weight:500}
  .prow .top span:last-child{color:var(--mute);white-space:nowrap;font-size:13px}
  .prow .bar{height:8px;margin:0}

  /* ================= EXPENSE FORM ================= */
  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .field input,.field select{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;width:100%;color:var(--ink);font-weight:500}
  .field input:focus,.field select:focus{outline:2px solid var(--pri2);outline-offset:0;background:var(--card)}
  .amt-wrap{position:relative}
  .amt-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:800;color:var(--mute)}
  .field input.amount{font-size:26px;font-weight:800;padding-left:38px;letter-spacing:-.5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink2);transition:all .15s}
  .chip:hover{border-color:var(--pri2)}
  .chip.on{background:linear-gradient(135deg,#1d4ed8,#2563eb);border-color:transparent;color:#fff;box-shadow:0 6px 14px -8px rgba(37,99,235,.9)}

  .day-total{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--pri-soft),var(--acc-soft));border-radius:13px;padding:13px 15px;margin-bottom:8px}
  .day-total span{font-size:13px;font-weight:600;color:var(--ink2)}
  .day-total b{font-size:22px;color:var(--pri);font-weight:800}
  .exp-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .exp-row:last-child{border-bottom:0}
  .exp-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .exp-main{flex:1;min-width:0}
  .exp-main b{font-size:14px;display:block;font-weight:700;color:var(--ink)}
  .exp-main small{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .exp-amt{font-weight:800;white-space:nowrap;color:var(--ink)}
  .grp-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);padding:8px 12px;margin:12px 0 2px;font-weight:700;background:var(--bg2);border-radius:10px;border:1px solid var(--line)}
  .grp-h:first-child{margin-top:0}
  .grp-h b{color:var(--pri);font-size:13px}

  .cat-row{margin-bottom:12px}
  .cat-row .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px;font-weight:600;color:var(--ink)}
  .cat-row .bar{height:8px;margin:0}

  .empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px;line-height:1.6}

  /* ================= BOTTOM TABS ================= */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
           background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
           border-top:1px solid var(--line);box-shadow:0 -8px 24px -16px rgba(15,23,42,.35)}
  .tabs-in{max-width:520px;margin:0 auto;display:flex;gap:6px}
  nav.tabs button{flex:1;background:none;border:0;padding:8px 4px;border-radius:13px;color:var(--mute);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--pri);background:var(--pri-soft);font-weight:700}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90vw;text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--bad)}
  .setup-warn{background:var(--mid-soft);color:var(--mid);border:1px solid color-mix(in srgb,var(--mid) 30%,transparent);border-left:4px solid var(--mid);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500;margin-bottom:14px;display:none}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hdr-in">
    <div class="brand">
      <div class="logo">₹</div>
      <div><h1>Daily Tracker</h1><small id="hdrDate"></small></div>
    </div>
    <div class="hdr-r">
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></div>
      <button class="hbtn" id="themeBtn" title="Switch theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="hbtn" id="refreshBtn" title="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="setup-warn" id="setupWarn">⚠️ <b>API_URL</b> is not set in index.html yet. Paste your Apps Script Web App URL.</div>

  <!-- ================= CHECKLIST ================= -->
  <section class="page" id="page-checklist">
    <div class="seg" id="ckSeg">
      <button data-m="day" class="on">Daily</button>
      <button data-m="month">Monthly</button>
    </div>

    <div data-ck="day">
      <div class="datebar">
        <button class="nav-btn" data-shift="-1" data-for="ckDate">‹</button>
        <input type="date" id="ckDate">
        <button class="nav-btn" data-shift="1" data-for="ckDate">›</button>
        <button class="today-btn" data-today="ckDate">Today</button>
      </div>
    </div>
    <div data-ck="month" hidden>
      <div class="datebar">
        <button class="nav-btn" data-shift="-1" data-for="ckMonth">‹</button>
        <input type="month" id="ckMonth">
        <button class="nav-btn" data-shift="1" data-for="ckMonth">›</button>
        <button class="today-btn" data-today="ckMonth">This Month</button>
      </div>
    </div>
    <div class="date-label" id="ckLabel"></div>

    <div class="stats">
      <div class="stat ok">
        <div class="s-top"><span class="s-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><small>Done</small></div>
        <b id="ckDone">0</b>
      </div>
      <div class="stat warn">
        <div class="s-top"><span class="s-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><small>Pending</small></div>
        <b id="ckPending">0</b>
      </div>
      <div class="stat pri">
        <div class="s-top"><span class="s-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span><small>Score</small></div>
        <b id="ckScore">0%</b>
      </div>
    </div>
    <div class="bar"><div id="ckBar" style="width:0%"></div></div>

    <div id="ckList"></div>

    <form class="add-form" id="addItemForm" data-ck="day">

    <div class="card">

        <b id="rpCount">0</b>
      </div>
      <div class="stat ok">
        <div class="s-top"><span class="s-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg></span><small>Avg / Day</small></div>
        <b id="rpAvg" style="font-size:19px">₹0</b>
      </div>
      <div class="stat gold">
        <div class="s-top"><span class="s-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.5 7 .9-5.1 4.8 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.4l7-.9z"/></svg></span><small>Top</small></div>
        <b id="rpTop" style="font-size:16px">—</b>
      </div>

    <div class="card">
      <h3>Category-wise</h3>
      <div id="rpCats"></div>

      <h3>All Entries</h3>

<nav class="tabs">
  <div class="tabs-in">
    <button data-tab="checklist">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>
      Checklist
    </button>
    <button data-tab="entry">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Entry Expense
    </button>
    <button data-tab="report">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Expense Report
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — Paste your Apps Script Web App URL here
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbxifU-DerTQPJoIaQAAsRtZTPWTmpiJJBHov3UVUyxSj20PHKVrCnhqvjAi78iHA4Bi/exec';

const CATEGORIES = [
  ['Food','🍔','#f97316'],['Grocery','🛒','#16a34a'],['Travel','🚌','#0ea5e9'],['Fuel','⛽','#eab308'],['Bills','💡','#8b5cf6'],
  ['Shopping','🛍️','#ec4899'],['Health','💊','#ef4444'],['Rent','🏠','#14b8a6'],['Education','📚','#6366f1'],['Other','📦','#64748b']
];
const MODES = ['UPI','Cash','Card','Bank'];

/* ---------------- Helpers ---------------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d || 1); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const shiftMonth = (ym,n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthDays = ym => { const [y,m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({length:n}, (_,i) => `${ym}-${pad(i+1)}`); };
const daysBetween = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000) + 1;
const inrFmt = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
const inr = n => inrFmt.format(n || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const niceDate = s => parseYmd(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const niceMonth = ym => parseYmd(ym + '-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const catIcon = c => (CATEGORIES.find(x => x[0] === c) || [,'📦'])[1];
const catColor = c => (CATEGORIES.find(x => x[0] === c) || [,,'#64748b'])[2];
const sum = arr => arr.reduce((t,e) => t + (Number(e.Amount) || 0), 0);
const empty = msg => `<div class="empty">${msg}</div>`;

function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 2600);
}
function setSync(state){
  $('#syncDot').className = 'dot ' + state;
  $('#syncText').textContent = state === 'ok' ? 'Synced' : state === 'err' ? 'Offline' : 'Syncing…';
}

/* ---------------- API ---------------- */
async function api(method, body){
  if (!API_URL.startsWith('https://')) throw new Error('API_URL is not set');
  const res = method === 'GET'
    ? await fetch(API_URL + '?action=getAll&t=' + Date.now())
    : await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Server error');
  return j;
}

/* ---------------- State ---------------- */
let DB = { expenses:[], items:[], logs:{} };
let ckMode = 'day', rpMode = 'month', selCat = 'Food';

async function loadAll(){
  if (!API_URL.startsWith('https://')) { $('#setupWarn').style.display = 'block'; setSync('err'); renderAll(); return; }
  setSync('loading');
  try {
    const j = await api('GET');
    DB.expenses = (j.expenses || []).map(e => ({...e, ID:String(e.ID), Date:String(e.Date).slice(0,10), Amount:Number(e.Amount) || 0}));
    DB.items = (j.items || []).map(i => ({...i, ID:String(i.ID), CreatedOn:String(i.CreatedOn || '').slice(0,10), DeletedOn:String(i.DeletedOn || '').slice(0,10)}));
    DB.logs = {};
    (j.logs || []).forEach(l => {
      DB.logs[String(l.Date).slice(0,10) + '|' + l.ItemID] = (l.Done === true || String(l.Done).toUpperCase() === 'TRUE');
    });
    setSync('ok');
  } catch (err) {
    setSync('err');
    toast('Could not load data: ' + err.message, 'err');
  }
  renderAll();
}

function renderAll(){ renderChecklist(); renderEntry(); renderReport(); }

/* =========================================================
   CHECKLIST
   ========================================================= */
const itemsOn = d => DB.items.filter(i => (!i.CreatedOn || i.CreatedOn <= d) && (!i.DeletedOn || d < i.DeletedOn));
const isDone  = (d,id) => !!DB.logs[d + '|' + id];

function setScore(done, total){
  const pending = total - done;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#ckDone').textContent = done;
  $('#ckPending').textContent = pending;
  $('#ckScore').textContent = pct + '%';
  $('#ckBar').style.width = pct + '%';
}

function renderChecklist(){
  const t = today();
  const list = $('#ckList');

  if (ckMode === 'day') {
    const d = $('#ckDate').value || t;
    $('#ckLabel').innerHTML = (d === t ? '<b>Today</b> • ' : '') + niceDate(d);
    const items = itemsOn(d);
    const done = items.filter(i => isDone(d, i.ID)).length;
    setScore(done, items.length);
    list.innerHTML = items.length
      ? items.map(i => {
          const ok = isDone(d, i.ID);
          return `<label class="ck-row ${ok ? 'done' : ''}">
            <input type="checkbox" data-id="${esc(i.ID)}" ${ok ? 'checked' : ''}>
            <span class="ck-box"></span>
            <span class="ck-text">${esc(i.Item)}</span>
            <button type="button" class="icon-btn del-item" data-id="${esc(i.ID)}" title="Remove task">✕</button>
          </label>`;
        }).join('')
      : empty('No checklist tasks for this day.<br>Add a new task below.');
    return;
  }

  // Monthly view
  const ym = $('#ckMonth').value || t.slice(0,7);
  $('#ckLabel').innerHTML = `<b>${niceMonth(ym)}</b> • only days up to today are counted`;
  const days = monthDays(ym);
  let total = 0, done = 0;
  const per = {};
  const offset = (parseYmd(days[0]).getDay() + 6) % 7; // Monday start

  let grid = ['M','T','W','T','F','S','S'].map(w => `<div class="wd">${w}</div>`).join('');
  grid += '<div class="day blank"></div>'.repeat(offset);
  grid += days.map(d => {
    const num = +d.slice(8);
    const tCls = d === t ? ' is-today' : '';
    if (d > t) return `<div class="day future${tCls}">${num}</div>`;
    const its = itemsOn(d);
    const dn = its.filter(i => isDone(d, i.ID)).length;
    total += its.length; done += dn;
    its.forEach(i => {
      if (!per[i.ID]) per[i.ID] = { name:i.Item, done:0, total:0, removed:!!i.DeletedOn };
      per[i.ID].total++;
      if (isDone(d, i.ID)) per[i.ID].done++;
    });
    const p = its.length ? dn / its.length : null;
    const cls = p === null ? '' : p === 1 ? 'full' : p >= .5 ? 'half' : p > 0 ? 'low' : 'zero';
    return `<button type="button" class="day ${cls}${tCls}" data-goto="${d}" title="${niceDate(d)}: ${dn}/${its.length} done">${num}</button>`;
  }).join('');

  setScore(done, total);

  const rows = Object.values(per).sort((a,b) => (b.done/b.total) - (a.done/a.total)).map(p => {
    const pct = Math.round(p.done / p.total * 100);
    return `<div class="prow"><div class="top"><span>${esc(p.name)}${p.removed ? ' <small style="color:var(--mute)">(removed)</small>' : ''}</span><span>${p.done}/${p.total} days • ${pct}%</span></div><div class="bar"><div style="width:${pct}%"></div></div></div>`;
  }).join('');

  list.innerHTML = `
    <div class="card">
      <h3>Day-wise</h3>
      <div class="month-grid">${grid}</div>
      <div class="legend">
        <span><i style="background:var(--acc)"></i>100%</span>
        <span><i style="background:var(--mid-soft);border:1px solid var(--mid)"></i>50%+</span>
        <span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>Some</span>
        <span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>0%</span>
      </div>
      <div class="legend" style="margin-top:6px">Tap any day to open its daily checklist.</div>
    </div>
    <div class="card">
      <h3>Task-wise</h3>
      ${rows || empty('No data for this month.')}
    </div>`;
}

async function toggleCheck(d, id, done){
  const key = d + '|' + id;
  const prev = !!DB.logs[key];
  DB.logs[key] = done;
  renderChecklist();
  setSync('loading');
  try {
    await api('POST', { action:'toggleCheck', date:d, itemId:id, done });
    setSync('ok');
  } catch (err) {
    DB.logs[key] = prev;
    renderChecklist();
    setSync('err');
    toast('Could not save: ' + err.message, 'err');
  }
}

$('#ckList').addEventListener('click', e => {
  const del = e.target.closest('.del-item');
  if (del) {
    e.preventDefault();
    deleteItem(del.dataset.id);
    return;
  }
  const go = e.target.closest('[data-goto]');
  if (go) {
    $('#ckDate').value = go.dataset.goto;
    setCkMode('day');
  }
});
$('#ckList').addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox]')) {
    toggleCheck($('#ckDate').value, e.target.dataset.id, e.target.checked);
  }
});

$('#addItemForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#newItem').value.trim();
  if (!name) return;
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const j = await api('POST', { action:'addItem', item:name, date: today() });
    DB.items.push({ ...j.data, ID:String(j.data.ID) });
    $('#newItem').value = '';
    toast('Task added ✓');
    renderChecklist();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

async function deleteItem(id){
  const it = DB.items.find(i => i.ID === id);
  if (!it || !confirm(`Remove "${it.Item}" from the checklist?\n(Past scores will be kept)`)) return;
  try {
    const j = await api('POST', { action:'deleteItem', id, date: today() });
    it.DeletedOn = j.data.DeletedOn;
    toast('Task removed');
    renderChecklist();
  } catch (err) {
    toast(err.message, 'err');
  }
}

function setCkMode(m){
  ckMode = m;
  $$('#ckSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $$('[data-ck]').forEach(el => el.hidden = el.dataset.ck !== m);
  renderChecklist();
}
$('#ckSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setCkMode(b.dataset.m); });

/* =========================================================
   ENTRY EXPENSE
   ========================================================= */
function expRow(e, showDate){
  const col = catColor(e.Category);
  return `<div class="exp-row">
    <div class="exp-ic" style="background:${col}22;box-shadow:inset 0 0 0 1px ${col}40">${catIcon(e.Category)}</div>
    <div class="exp-main"><b>${esc(e.Category)}</b>
      <small>${esc(e.Description || '—')}${e.Mode ? ' • ' + esc(e.Mode) : ''}${showDate ? ' • ' + niceDate(e.Date) : ''}</small></div>
    <div class="exp-amt">${inr(e.Amount)}</div>
    <button type="button" class="icon-btn del-exp" data-id="${esc(e.ID)}" title="Delete">✕</button>
  </div>`;
}

function renderEntry(){
  const t = today();
  const d = $('#exDate').value || t;
  $('#exLabel').innerHTML = (d === t ? "<b>Today's entry</b> • " : '<b>Entry date</b> • ') + niceDate(d);
  const list = DB.expenses.filter(e => e.Date === d).slice().reverse();
  $('#exDayTotal').textContent = inr(sum(list));
  $('#exDayCount').textContent = `${list.length} ${list.length === 1 ? 'entry' : 'entries'} on this day`;
  $('#exList').innerHTML = list.length ? list.map(e => expRow(e, false)).join('') : empty('No expenses on this day yet.');
}

$('#catChips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  selCat = c.dataset.cat;
  $$('#catChips .chip').forEach(x => x.classList.toggle('on', x === c));
});

$('#expForm').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    action: 'addExpense',
    date: $('#exDate').value,
    amount: parseFloat($('#exAmount').value),
    category: selCat,
    description: $('#exDesc').value.trim(),
    mode: $('#exMode').value
  };
  if (!body.date) return toast('Please select a date', 'err');
  if (!(body.amount > 0)) return toast('Please enter a valid amount', 'err');
  const btn = $('#exSave');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const j = await api('POST', body);
    DB.expenses.push({ ...j.data, ID:String(j.data.ID), Amount:Number(j.data.Amount) });
    $('#exAmount').value = '';
    $('#exDesc').value = '';
    toast(`${inr(body.amount)} saved ✓`);
    renderEntry(); renderReport();
    $('#exAmount').focus();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Expense';
  }
});

document.addEventListener('click', async e => {
  const del = e.target.closest('.del-exp');
  if (!del) return;
  const ex = DB.expenses.find(x => x.ID === del.dataset.id);
  if (!ex || !confirm(`${inr(ex.Amount)} (${ex.Category}) — delete this entry?`)) return;
  try {
    await api('POST', { action:'deleteExpense', id: ex.ID });
    DB.expenses = DB.expenses.filter(x => x.ID !== ex.ID);
    toast('Entry deleted');
    renderEntry(); renderReport();
  } catch (err) {
    toast(err.message, 'err');
  }
});

/* =========================================================
   EXPENSE REPORT
   ========================================================= */
function rpRange(){
  if (rpMode === 'day') {
    const d = $('#rpDate').value || today();
    return [d, d, niceDate(d)];
  }
  if (rpMode === 'month') {
    const ym = $('#rpMonth').value || today().slice(0,7);
    const ds = monthDays(ym);
    return [ds[0], ds[ds.length-1], niceMonth(ym)];
  }
  let f = $('#rpFrom').value || today(), t = $('#rpTo').value || today();
  if (f > t) [f, t] = [t, f];
  return [f, t, `${niceDate(f)} – ${niceDate(t)}`];
}

function renderReport(){
  const [from, to, label] = rpRange();
  const t = today();
  const list = DB.expenses.filter(e => e.Date >= from && e.Date <= to)
                          .sort((a,b) => b.Date.localeCompare(a.Date));
  const total = sum(list);

  // Average: for an ongoing period, only days up to today are counted
  const end = (to > t && from <= t) ? t : to;
  const nDays = Math.max(1, daysBetween(from, end));

  const cats = {};
  list.forEach(e => cats[e.Category] = (cats[e.Category] || 0) + e.Amount);
  const catArr = Object.entries(cats).sort((a,b) => b[1] - a[1]);

  $('#rpLabel').textContent = label;
  $('#rpTotal').textContent = inr(total);
  $('#rpCount').textContent = list.length;
  $('#rpAvg').textContent = inr(Math.round(total / nDays));
  $('#rpTop').textContent = catArr.length ? catIcon(catArr[0][0]) + ' ' + catArr[0][0] : '—';

  $('#rpCats').innerHTML = catArr.length
    ? catArr.map(([c, amt]) => {
        const pct = total ? Math.round(amt / total * 100) : 0;
        const col = catColor(c);
        return `<div class="cat-row"><div class="top"><span>${catIcon(c)} ${esc(c)}</span><span><b>${inr(amt)}</b> <small style="color:var(--mute);font-weight:600">${pct}%</small></span></div><div class="bar"><div style="width:${pct}%;background:${col}"></div></div></div>`;
      }).join('')
    : empty('No expenses in this period.');

  const groups = {};
  list.forEach(e => (groups[e.Date] = groups[e.Date] || []).push(e));
  $('#rpList').innerHTML = list.length
    ? Object.keys(groups).sort().reverse().map(d =>
        `<div class="grp-h"><span>${niceDate(d)}</span><b>${inr(sum(groups[d]))}</b></div>` +
        groups[d].map(e => expRow(e, false)).join('')
      ).join('')
    : empty('No entries found.');
}

function setRpMode(m){
  rpMode = m;
  $$('#rpSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $$('[data-rp]').forEach(el => el.hidden = el.dataset.rp !== m);
  renderReport();
}
$('#rpSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setRpMode(b.dataset.m); });

/* =========================================================
   COMMON: date arrows, tabs, theme, init
   ========================================================= */
const RENDER_FOR = { ckDate:renderChecklist, ckMonth:renderChecklist, exDate:renderEntry, rpDate:renderReport, rpMonth:renderReport, rpFrom:renderReport, rpTo:renderReport };

document.addEventListener('click', e => {
  const s = e.target.closest('[data-shift]');
  const td = e.target.closest('[data-today]');
  if (!s && !td) return;
  const id = (s || td).dataset.for || (td && td.dataset.today);
  const inp = document.getElementById(id);
  if (td) inp.value = inp.type === 'month' ? today().slice(0,7) : today();
  else inp.value = inp.type === 'month' ? shiftMonth(inp.value, +s.dataset.shift) : addDays(inp.value, +s.dataset.shift);
  RENDER_FOR[id]();
});
Object.keys(RENDER_FOR).forEach(id => document.getElementById(id).addEventListener('change', RENDER_FOR[id]));

function showTab(name){
  $$('.page').forEach(p => p.classList.toggle('on', p.id === 'page-' + name));
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  try { localStorage.setItem('dt_tab', name); } catch (_) {}
  window.scrollTo(0, 0);
}
$('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
$('#refreshBtn').addEventListener('click', loadAll);

// Theme toggle (light / dark) — the choice is remembered in the browser
function isDark(){
  const a = document.documentElement.dataset.theme;
  return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
$('#themeBtn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('dt_theme', next); } catch (_) {}
});

function init(){
  try { const th = localStorage.getItem('dt_theme'); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
  const t = today(), ym = t.slice(0,7);
  $('#hdrDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('#ckDate').value = t; $('#ckMonth').value = ym;
  $('#exDate').value = t;                       // Default: today's date
  $('#rpDate').value = t; $('#rpMonth').value = ym;
  $('#rpFrom').value = ym + '-01'; $('#rpTo').value = t;

  $('#catChips').innerHTML = CATEGORIES.map(([c, i]) =>
    `<button type="button" class="chip ${c === selCat ? 'on' : ''}" data-cat="${c}">${i} ${c}</button>`).join('');
  $('#exMode').innerHTML = MODES.map(m => `<option>${m}</option>`).join('');

  let tab = 'checklist';
  try { tab = localStorage.getItem('dt_tab') || 'checklist'; } catch (_) {}
  showTab(tab);
  loadAll();
}
init();
</script>
